
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cosmic Blaster - Space Shooter</title>

    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:,">
    <style>
#mobileControls {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin: 15px auto;
}

#mobileControls button {
    font-size: 24px;
    font-weight: bold;
    padding: 16px 24px;
    border: 2px solid #00eaff;
    border-radius: 15px;
    background: linear-gradient(145deg, #001f5c, #0066ff);
    color: white;
    box-shadow: 0 0 10px #00eaff, 0 0 25px #0066ff;
    text-shadow: 0 0 8px white;
    touch-action: none;
    cursor: pointer;
}

#mobileControls button:active {
    transform: scale(0.9);
    background: #00aaff;
    box-shadow: 0 0 25px #00eaff;
}

@media (min-width: 768px) {
    #mobileControls {
        display: none;
    }
}
</style>
</head>

<body>

    <main class="game-wrapper">

        <div id="startScreen">

            <h1>🚀 Cosmic Blaster</h1>

            <p>Welcome to my Space Shooter Game!</p>

            <h2>Ready for Battle?</h2>

            <p>Use your keyboard to control your spaceship.</p>

            <div class="difficulty-buttons">
                <button id="easyBtn"
                    onclick="setDifficulty('easy')">
                    Easy
                </button>

                <button id="mediumBtn"
                    onclick="setDifficulty('medium')">
                    Medium
                </button>

                <button id="hardBtn"
                    onclick="setDifficulty('hard')">
                    Hard
                </button>
            </div>

            <button onclick="startGame()">
                Start Game
            </button>

        </div>

        <div class="game-container">

            <canvas id="gameCanvas"
                width="600"
                height="400">
                </canvas>

<button id="restartBtn" onclick="startGame()">
    🔄 Restart Game
</button>


        </div>

    </main>
    <div id="mobileControls">
    <button id="leftBtn">⬅️</button>
    <button id="fireBtn">🔥 FIRE</button>
    <button id="rightBtn">➡️</button>
</div>

    <script src="script.js"></script>

</body>
</html>
